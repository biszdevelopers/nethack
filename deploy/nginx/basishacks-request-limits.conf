# Include inside the site's `server {}` block. The 10 MiB ingress cap supports
# profile-image JSON updates while bounding buffered request bodies at the proxy.
client_max_body_size 10m;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 30s;

# The app rate-limits per caller, but a proxy-level burst guard sheds floods
# before they reach Node. Define the zone once in the http {} block:
#
#   limit_req_zone $binary_remote_addr zone=basishacks_api:10m rate=120r/s;
#
# Then enable it inside the API location:
#
#   location /api/ {
#       limit_req zone=basishacks_api burst=240 nodelay;
#       limit_req_status 429;
#       proxy_pass http://127.0.0.1:3000;
#   }
#
# With exactly one proxy in front, forward the original peer so the app picks
# the right client address (TRUSTED_PROXY_HOPS=1):
#
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header Host $host;
