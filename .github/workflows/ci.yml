name: CI

on:
    push:
        branches: [main, enhance-and-debloat]
    pull_request:
        branches: [main, enhance-and-debloat]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    BASIS_AUTH_COOKIE_SECRET: ${{ secrets.BASIS_AUTH_COOKIE_SECRET || 'ci-session-cookie-secret-at-least-32-bytes-long' }}

jobs:
    build-and-test:
        name: Build, Test & Docs
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: basishacks_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d basishacks_test" --health-interval 5s --health-timeout 5s --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Checkout @basis/schema source
              run: |
                  git clone --depth 1 https://github.com/biszdevelopers/basis-schema.git ../basis-schema

            - name: Cache Bun dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Audit dependencies
              run: bun audit

            - name: Run PostgreSQL integration tests
              run: bun run test:postgres
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  BASISHACKS_POSTGRES_TEST: "1"

            - name: Run tests
              run: bun run test
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  BASISHACKS_POSTGRES_TEST: "1"

            - name: Build Nuxt app
              run: bun run build

            - name: Cache docs dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      documentation/node_modules
                  key: ${{ runner.os }}-docs-bun-${{ hashFiles('documentation/package.json', 'documentation/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-docs-bun-

            - name: Install docs dependencies
              working-directory: documentation
              run: bun install --frozen-lockfile

            - name: Build documentation
              working-directory: documentation
              run: bun run build
