name: CI

on:
    push:
        branches: [main, enhance-and-debloat]
    pull_request:
        branches: [main, enhance-and-debloat]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    BASIS_AUTH_COOKIE_SECRET: ${{ secrets.BASIS_AUTH_COOKIE_SECRET || 'ci-session-cookie-secret-at-least-32-bytes-long' }}

jobs:
    build-and-test:
        name: Build, Test & Docs
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: basishacks_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d basishacks_test" --health-interval 5s --health-timeout 5s --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Checkout @basis/schema source
              run: |
                  git clone --depth 1 https://github.com/biszdevelopers/basis-schema.git ../basis-schema

            - name: Cache Bun dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Audit dependencies
              run: bun audit

            - name: Run PostgreSQL integration tests
              run: bun run test:postgres
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  BASISHACKS_POSTGRES_TEST: "1"

            - name: Rehearse SQLite import against a fresh PostgreSQL database
              run: |
                  psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE basishacks_import_test'
                  bun scripts/create-import-smoke-db.mjs "$SQLITE_IMPORT_PATH" --populate
                  bun run db:migrate
                  bun scripts/import-sqlite-to-postgres.mjs --confirm
                  bun scripts/verify-sqlite-import-smoke.mjs
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_import_test
                  SQLITE_IMPORT_PATH: ${{ runner.temp }}/basishacks-import-smoke.sqlite

            - name: Rehearse legacy single-hackathon SQLite import
              run: |
                  psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE basishacks_legacy_import_test'
                  bun scripts/create-import-smoke-db.mjs "$SQLITE_IMPORT_PATH" --populate --legacy
                  bun run db:migrate
                  bun run db:import-sqlite:check
                  bun run db:import-sqlite -- --confirm
                  bun scripts/verify-sqlite-legacy-import-smoke.mjs
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_legacy_import_test
                  SQLITE_IMPORT_PATH: ${{ runner.temp }}/basishacks-legacy-import-smoke.sqlite

            - name: Run tests
              run: bun run test
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  BASISHACKS_POSTGRES_TEST: "1"

            - name: Enforce 100% executable source coverage
              run: bun run test:coverage
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  BASISHACKS_POSTGRES_TEST: "1"

            - name: Build Nuxt app
              run: bun run build
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test

            - name: Create isolated browser-test database
              run: psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE basishacks_e2e'

            - name: Test isolated OIDC provider
              run: bun run test:e2e:oidc

            - name: Install Playwright Chromium
              run: bun run playwright install --with-deps chromium

            - name: Run responsive browser journeys
              run: bun run test:e2e
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_e2e
                  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3005

            - name: Upload browser journey diagnostics
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: browser-journey-diagnostics
                  path: .tmp-playwright-results/
                  if-no-files-found: ignore
                  retention-days: 3
                  include-hidden-files: true

            - name: Smoke test Bun and Node production startup
              run: |
                  node scripts/smoke-production-start.mjs bun
                  node scripts/smoke-production-start.mjs node
              env:
                  BASIS_AUTH_COOKIE_SECRET: ci-production-cookie-secret-at-least-32-bytes-long
                  BASIS_AUTH_ISSUER: https://auth.example.invalid
                  BASIS_AUTH_CLIENT_ID: basishacks-ci
                  BASIS_AUTH_CLIENT_SECRET: ci-client-secret
                  BASIS_AUTH_RESOURCE: devconnect://nethack.bisz.dev
                  CURRENT_URL_ORIGIN: https://basishacks.example.invalid
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  TRUSTED_PROXY_HOPS: "0"

            - name: Cache docs dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      documentation/node_modules
                  key: ${{ runner.os }}-docs-bun-${{ hashFiles('documentation/package.json', 'documentation/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-docs-bun-

            - name: Install docs dependencies
              working-directory: documentation
              run: bun install --frozen-lockfile

            - name: Build documentation
              working-directory: documentation
              run: bun run build

            - name: Verify production-only install
              run: bun install --production --frozen-lockfile
