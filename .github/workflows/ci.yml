name: CI

on:
    push:
        branches: [main, enhance-and-debloat]
    pull_request:
        branches: [main, enhance-and-debloat]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    BASIS_AUTH_COOKIE_SECRET: ci-session-cookie-secret-at-least-32-bytes-long

jobs:
    # Pin every action to a full commit SHA when bumping; tags are mutable.
    secret-scan:
        name: Secret scan
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Install gitleaks
              run: |
                  curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tar.gz
                  echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
                  tar -xzf gitleaks.tar.gz gitleaks
                  sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

            - name: Prepare trusted gitleaks configuration
              run: |
                  # Use workflow-owned rules and ignore handling so a pull request
                  # cannot add its own allowlist, ignore file, or baseline entry.
                  printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
                  mkdir -p "$RUNNER_TEMP/gitleaks-ignore"
                  BASE_REF="origin/${{ github.base_ref || 'main' }}"
                  if git show "$BASE_REF:.gitleaks-baseline.json" > "$RUNNER_TEMP/gitleaks-baseline.json" 2>/dev/null; then
                    echo "Using baseline from $BASE_REF"
                  else
                    cp .gitleaks-baseline.json "$RUNNER_TEMP/gitleaks-baseline.json"
                  fi

            - name: Scan history for leaked secrets
              run: gitleaks detect --source . --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore" --baseline-path "$RUNNER_TEMP/gitleaks-baseline.json" --redact --verbose --exit-code 1

    build-and-test:
        name: Build, Test & Docs
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: basishacks_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d basishacks_test" --health-interval 5s --health-timeout 5s --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24

            - name: Checkout @basis/schema source
              run: |
                  git clone https://github.com/biszdevelopers/basis-schema.git ../basis-schema
                  git -C ../basis-schema checkout 7aad59dae1550133ae0760cd26e91decce578f38

            - name: Cache Bun dependencies
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock', 'patches/**', 'vendor/**') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Audit dependencies
              run: bun audit

            - name: Type-check the app and server
              run: |
                  # The sibling @basis/schema source imports zod; expose this
                  # project's installed dependencies to it for vue-tsc.
                  ln -s "$PWD/node_modules" ../basis-schema/node_modules
                  bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Run PostgreSQL integration tests
              run: bun run test:postgres
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  BASISHACKS_POSTGRES_TEST: "1"

            - name: Rehearse SQLite import against a fresh PostgreSQL database
              run: |
                  psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE basishacks_import_test'
                  bun scripts/create-import-smoke-db.mjs "$SQLITE_IMPORT_PATH" --populate
                  bun run db:migrate
                  bun scripts/import-sqlite-to-postgres.mjs --confirm
                  bun scripts/verify-sqlite-import-smoke.mjs
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_import_test
                  SQLITE_IMPORT_PATH: ${{ runner.temp }}/basishacks-import-smoke.sqlite

            - name: Rehearse legacy single-hackathon SQLite import
              run: |
                  psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE basishacks_legacy_import_test'
                  bun scripts/create-import-smoke-db.mjs "$SQLITE_IMPORT_PATH" --populate --legacy
                  bun run db:migrate
                  bun run db:import-sqlite:check
                  bun run db:import-sqlite -- --confirm
                  bun scripts/verify-sqlite-legacy-import-smoke.mjs
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_legacy_import_test
                  SQLITE_IMPORT_PATH: ${{ runner.temp }}/basishacks-legacy-import-smoke.sqlite

            - name: Run tests
              run: bun run test
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  BASISHACKS_POSTGRES_TEST: "1"

            - name: Enforce 100% executable source coverage
              run: bun run test:coverage
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  BASISHACKS_POSTGRES_TEST: "1"

            # `prebuild` builds the VitePress site before Nuxt, so docs
            # dependencies must be installed before the app build.
            - name: Cache docs dependencies
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.bun/install/cache
                      documentation/node_modules
                  key: ${{ runner.os }}-docs-bun-${{ hashFiles('documentation/package.json', 'documentation/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-docs-bun-

            - name: Install docs dependencies
              working-directory: documentation
              run: bun install --frozen-lockfile

            - name: Build Nuxt app
              run: bun run build
              env:
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test

            - name: Create isolated browser-test database
              run: psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE basishacks_e2e'

            - name: Test isolated OIDC provider
              run: bun run test:e2e:oidc

            - name: Install Playwright Chromium
              run: bun run playwright install --with-deps chromium

            - name: Run responsive browser journeys
              run: bun run test:e2e
              env:
                  BASISHACKS_E2E: "1"
                  BASISHACKS_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_e2e
                  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3005

            - name: Upload browser journey diagnostics
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: browser-journey-diagnostics
                  path: |
                      .tmp-playwright-results/**/error-context.md
                      .tmp-playwright-results/**/test-failed-*.png
                      .tmp-playwright-results/**/trace.zip
                  if-no-files-found: ignore
                  retention-days: 3
                  include-hidden-files: true

            - name: Smoke test Bun and Node production startup
              run: |
                  node scripts/smoke-production-start.mjs bun
                  node scripts/smoke-production-start.mjs node
              env:
                  BASIS_AUTH_COOKIE_SECRET: ci-production-cookie-secret-at-least-32-bytes-long
                  BASIS_AUTH_ISSUER: https://auth.example.invalid
                  BASIS_AUTH_CLIENT_ID: basishacks-ci
                  BASIS_AUTH_CLIENT_SECRET: ci-client-secret
                  BASIS_AUTH_RESOURCE: devconnect://nethack.bisz.dev
                  BASIS_AUTH_RESOURCE_SECRET: ci-resource-secret
                  BASIS_AUTH_INTERNAL_URL: http://127.0.0.1:3001
                  CURRENT_URL_ORIGIN: https://basishacks.example.invalid
                  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/basishacks_test
                  TRUSTED_PROXY_HOPS: "0"

            - name: Build documentation
              working-directory: documentation
              run: bun run build

            - name: Verify production-only install
              run: bun install --production --frozen-lockfile

    sbom:
        name: SBOM
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Generate SPDX SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  format: spdx-json
                  artifact-name: basishacks-sbom.spdx.json
                  upload-artifact: true
