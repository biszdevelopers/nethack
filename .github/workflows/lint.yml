name: Lint

on:
    push:
        branches: [main, enhance-and-debloat]
    pull_request:
        branches: [main, enhance-and-debloat]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    formatting:
        name: Oxfmt Format Check
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14

            - name: Checkout @basis/schema source
              run: |
                  git clone https://github.com/biszdevelopers/basis-schema.git ../basis-schema
                  git -C ../basis-schema checkout 7aad59dae1550133ae0760cd26e91decce578f38

            - name: Cache Bun dependencies
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock', 'patches/**', 'vendor/**') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun run format:check

            - name: Run ESLint
              run: bun run lint
